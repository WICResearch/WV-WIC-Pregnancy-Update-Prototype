<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WV WIC Pregnancy Update</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fa;
      margin: 0;
      color: #24323c;
    }

    .demo-banner {
      background: #fff3cd;
      color: #664d03;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    header {
      background: white;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #d8e3e9;
    }

    header h1 {
      color: #164b72;
      margin-bottom: 5px;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .button {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      background: #164b72;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button.secondary {
      background: #e8eff3;
      color: #164b72;
    }
  </style>
</head>

<body>

  <div class="demo-banner">
    DEMONSTRATION ONLY — DO NOT ENTER REAL PARTICIPANT INFORMATION
  </div>

  <header>
    <h1>West Virginia WIC</h1>
    <p>Pregnancy Information Update Prototype</p>
  </header>

  <main>
    <div class="card">

      <h2>Welcome</h2>

      <p>
        This prototype demonstrates a private, participant-centered
        process for notifying WIC when a pregnancy has ended.
      </p>

      <a class="button" href="#">
        Participant Portal
      </a>

      <a class="button secondary" href="#">
        WIC Staff Portal
      </a>

    </div>
  </main>

</body>
</html>
